name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., v1.0.0)'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  release:
    needs: ci
    runs-on: ubuntu-latest
    env:
      # Support both vars (GitHub/Gitea Actions) and env vars (act testing)
      NPM_REGISTRY_URL: ${{ vars.NPM_REGISTRY_URL || env.NPM_REGISTRY_URL }}
      NPM_REGISTRY_USERNAME: ${{ vars.NPM_REGISTRY_USERNAME || env.NPM_REGISTRY_USERNAME }}
      NPM_REGISTRY_TOKEN: ${{ secrets.NPM_REGISTRY_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Parse and validate version tag
        id: version
        uses: LiquidLogicLabs/git-tag-validate-version-action@v1
        with:
          tag: ${{ github.event.inputs.tag || github.ref_name }}
          version-type: 'auto'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          # Use default npm registry (npmjs.org) for installing dependencies

      - name: Install dependencies
        run: npm ci

      - name: Build and package
        run: npm run package

      - name: Create npm tarball
        id: pack
        run: |
          PACK_FILE=$(npm pack --silent)
          echo "tgz=${PACK_FILE}" >> "$GITHUB_OUTPUT"

      - name: Create dist zip
        run: zip -r dist.zip dist

      - name: Generate release notes
        id: release_notes
        shell: bash
        run: |
          set -euo pipefail

          CURRENT_TAG="${{ github.event.inputs.tag || github.ref_name }}"

          # Pick the previous semver tag (best-effort). This avoids depending on
          # external changelog-builder actions, which may not be compatible with
          # all runners/forges.
          PREV_TAG="$(git tag --list 'v*.*.*' --sort=-version:refname | grep -v "^${CURRENT_TAG}$" | head -n 1 || true)"

          {
            echo "changelog<<EOF"
            echo "## ${CURRENT_TAG}"
            echo ""

            if [ -n "${PREV_TAG}" ]; then
              echo "Changes since ${PREV_TAG}:"
              git log --pretty=format:'- %s (%h)' "${PREV_TAG}..HEAD"
            else
              echo "Changes:"
              git log -1 --pretty=format:'- %s (%h)'
            fi

            echo ""
            echo "---"
            echo ""
            echo "### Usage"
            echo ""
            echo '```yaml'
            echo "- uses: LiquidLogicLabs/npm-package-git-platfom-detector@${CURRENT_TAG}"
            echo '```'
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create/Update Major, Minor, and Latest Version Tags
        if: steps.version.outputs.has-prerelease != 'true' && steps.version.outputs.is-valid == 'true'
        uses: LiquidLogicLabs/git-floating-version-tags-action@v1
        with:
          tag: ${{ github.event.inputs.tag || github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN || secrets.GITEA_TOKEN }}

      - name: Create Release
        uses: LiquidLogicLabs/git-action-release@v1
        with:
          tag: ${{ github.event.inputs.tag || github.ref_name }}
          name: Release ${{ steps.version.outputs.version }}
          body: ${{ steps.release_notes.outputs.changelog }}
          draft: false
          prerelease: ${{ steps.version.outputs.has-prerelease == 'true' }}
          artifacts: ${{ steps.pack.outputs.tgz }},dist.zip
          replaces-artifacts: true
          token: ${{ secrets.GITHUB_TOKEN || secrets.GITEA_TOKEN }}

      - name: Publish package to registry
        if: env.NPM_REGISTRY_URL != '' && env.NPM_REGISTRY_TOKEN != ''
        uses: JS-DevTools/npm-publish@v4
        with:
          token: ${{ secrets.NPM_REGISTRY_TOKEN }}
          registry: ${{ vars.NPM_REGISTRY_URL || env.NPM_REGISTRY_URL }}
          ignore-scripts: true

      - name: Release Summary
        run: |
          echo "## Release Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag**: ${{ github.event.inputs.tag || github.ref_name }}" >> $GITHUB_STEP_SUMMARY
