name: CI

on:
  push:
    branches: ['**']
    tags-ignore: ['**']
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches: ['**']
    paths-ignore:
      - '**/*.md'
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow || 'CI' }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Check formatting
        # Non-blocking until Phase 6 reformats. Do not make this blocking here.
        continue-on-error: true
        run: npm run format:check

      - name: Reject duplicate forge workflow directories
        run: |
          # Gitea Actions runs .github/workflows/ — verified against a Gitea-hosted repo in
          # this set that has no .gitea/ directory and whose jobs run there successfully.
          # A second copy is not needed, and the one that existed had drifted badly: it had
          # missed every CI gate added to .github/, and all the defects found in this repo
          # set lived in it, because it is the copy no linter or scanner reads.
          # If a forge genuinely needs its own workflow, get that approved and add the
          # directory to the allowlist below with the reason.
          found=""
          for d in .gitea .forgejo .circleci .drone .woodpecker; do
            [ -e "$d" ] && found="$found $d"
          done
          if [ -n "$found" ]; then
            echo "::error::Duplicate forge workflow directory present:$found"
            echo "::error::.github/workflows/ is the single source for every forge."
            echo "::error::If this is deliberate, record the approved reason and amend this check."
            exit 1
          fi
          echo "No duplicate forge workflow directories."
      - name: Lint workflows
        # Scoped to ci.yml in Phase 0; Phase 1 fixes release.yml shellcheck
        # findings and removes the scoping. Gitea Actions does not resolve
        # docker:///Marketplace uses: forms, so this repo uses a pinned CLI
        # download instead of the docker://rhysd/actionlint form.
        run: |
          curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash \
            | bash -s -- latest "${RUNNER_TEMP:-/tmp}"
          "${RUNNER_TEMP:-/tmp}/actionlint" -color .github/workflows/ci.yml

      - name: Scan for secrets
        # Pinned CLI download (not gitleaks-action): Gitea Actions does not
        # resolve docker:///Marketplace uses: forms, and the CLI needs no
        # GITLEAKS_LICENSE. ${RUNNER_TEMP:-/tmp} because Gitea's act_runner
        # does not document setting RUNNER_TEMP. The `test -e .git` guard
        # matters: gitleaks exits 0 when it cannot see a git repo.
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz" \
            | tar -xz -C "${RUNNER_TEMP:-/tmp}" gitleaks
          test -e .git || { echo "::error::not a git repo"; exit 1; }
          "${RUNNER_TEMP:-/tmp}/gitleaks" detect --source=. --no-banner --redact

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  test:
    needs: lint
    uses: ./.github/workflows/test.yml
    secrets: inherit
